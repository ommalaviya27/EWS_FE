<div class="search-bar-wrapper" [class.expanded]="isExpanded">
  <button type="button" class="icon-btn" (click)="toggleSearch()">
    <span class="search-icon material-icons">search</span>
  </button>

  <input
    class="search-input"
    type="text"
    [placeholder]="placeholder"
    [value]="inputValue"
    (input)="$event && onInput($any($event.target).value)"
    autocomplete="off"
    spellcheck="false"
  />

  @if (inputValue) {
  <button type="button" class="clear-btn" (click)="clearSearch()" aria-label="Clear search">
    <span class="material-icons">close</span>
  </button>
  }
</div>
