<div class="input-wrapper" [formGroup]="formGroup">
  <span class="input-icon">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
      <circle cx="12" cy="7" r="4"/>
    </svg>
  </span>
  <input
    type="text"
    class="form-input"
    [class.is-invalid]="isTouched && isInvalid"
    [formControlName]="config.formControlName"
    [placeholder]="config.placeholder || 'Enter your name'"
    autocomplete="name"
  />
</div>

@if (isTouched && isInvalid) {
  <div class="error-text">
    @if (control.hasError('required')) {
      Name is required.
    } @else {
      Please enter a valid name (letters and spaces only, 2–100 characters).
    }
  </div>
}
