<div class="input-wrapper" [formGroup]="formGroup">
  <span class="input-icon">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
    </svg>
  </span>
  <input
    [type]="showPassword ? 'text' : 'password'"
    class="form-input"
    [class.is-invalid]="isTouched && (control?.hasError('required') || isInvalidPassword)"
    [formControlName]="config.formControlName"
    [placeholder]="config.placeholder || 'Enter your password'"
    (input)="onInput($event)"
    (blur)="onBlur($event)"
    autocomplete="current-password"
  />
  <button type="button" class="toggle-btn" (click)="togglePassword()" tabindex="-1">
    @if (showPassword) {
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
        <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
        <line x1="1" y1="1" x2="23" y2="23"/>
      </svg>
    } @else {
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
    }
  </button>
</div>

@if (isTouched && (control?.hasError('required') || isInvalidPassword)) {
  <div class="error-text">
    @if (control?.hasError('required')) {
      {{ config.placeholder || 'Password' }} is required.
    } @else {
      Password must be 8–15 characters with letters, numbers, and a special character.
    }
  </div>
}
