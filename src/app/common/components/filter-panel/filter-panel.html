<div
  class="offcanvas offcanvas-end"
  [class.show]="isOpen"
  [style.visibility]="isOpen ? 'visible' : 'hidden'"
  tabindex="-1"
>
  <div class="filter-header">
    <h6 class="title">Filter</h6>
    <button class="close-btn" type="button" (click)="resetFilter()">✕</button>
  </div>

  <div>
    @for (field of config.fields; track field.key) { @if (field.type === 'select') {
    <div class="position-relative">
      @if (field.label) {
      <label class="filter-label">{{ field.label }}</label>
      }
      <div class="position-relative">
        <select
          class="form-select filter-select"
          [name]="field.key"
          [(ngModel)]="fieldValues[field.key]"
        >
          <option [ngValue]="''">{{ field.placeholder || 'Select' }}</option>
          @for (opt of field.options; track opt.value) {
          <option [ngValue]="opt.value">{{ opt.label }}</option>
          }
        </select>
      </div>
    </div>
    } @if (field.type === 'text') {
    <div class="position-relative">
      @if (field.label) {
      <label class="filter-label">{{ field.label }}</label>
      }
      <div class="position-relative">
        <input
          type="text"
          class="filter-input"
          [class.has-icon]="!!field.icon"
          [name]="field.key"
          [placeholder]="field.placeholder || field.label || ''"
          [(ngModel)]="fieldValues[field.key]"
        />
        @if (field.icon) {
        <img [src]="field.icon" class="filter-icon" alt="icon" />
        }
      </div>
    </div>
    } @if (field.type === 'date') {
    <div class="position-relative">
      @if (field.label) {
      <label class="filter-label">{{ field.label }}</label>
      }
      <input
        type="date"
        class="filter-input"
        [name]="field.key"
        [(ngModel)]="fieldValues[field.key]"
      />
    </div>
    } }

    <div class="filter-footer">
      <app-button [config]="resetConfig"></app-button>
      <app-button [config]="applyConfig"></app-button>
    </div>
  </div>
</div>

@if (isOpen) {
<div class="offcanvas-backdrop fade show" (click)="resetFilter()"></div>
}
