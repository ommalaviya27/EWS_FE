@if (visible) {
  <div class="pm-overlay" (click)="onCancel()">
    <div class="pm-modal" (click)="$event.stopPropagation()">
      <div class="pm-card">

        <div class="pm-header">
          <h4 class="pm-title">Change Password</h4>
          <button type="button" class="pm-close" (click)="onCancel()" aria-label="Close">✕</button>
        </div>

        <div class="security-icon-wrapper">
          <div class="security-icon">
            <span class="material-icons">lock_reset</span>
          </div>
        </div>

        <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()" novalidate>
          <div class="pm-field">
            <app-password [config]="oldPasswordConfig" />
          </div>
          <div class="pm-field">
            <app-password [config]="newPasswordConfig" />
          </div>
          <div class="pm-field">
            <app-password [config]="confirmPasswordConfig" />
            @if (passwordMismatch) {
              <div class="invalid-feedback d-block text-start mt-1">
                Passwords do not match.
              </div>
            }
          </div>

          <button type="button" class="forgot-pwd-link" (click)="navigateToForgotPassword()">
            Forgot Password?
          </button>

          <div class="pm-footer">
            <app-button [config]="cancelBtnConfig"></app-button>
            <app-button [config]="submitBtnConfig"></app-button>
          </div>
        </form>

      </div>
    </div>
  </div>
}
