<div class="change-password-page">
  <div class="form-container-centered">
    <div class="form-card">
      <div class="card-top-header">
        <button type="button" class="back-btn" (click)="goBack()" title="Go Back">
          <span class="material-icons">arrow_back</span>
        </button>
        <div class="title-text-group">
          <h1 class="page-title">Change Password</h1>
          <p class="page-subtitle">Update your account password</p>
        </div>
      </div>

      <div class="security-icon-wrapper">
        <div class="security-icon">
          <span class="material-icons">lock_reset</span>
        </div>
      </div>



      <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <app-password [config]="oldPasswordConfig" />
        </div>

        <div class="form-group">
          <app-password [config]="newPasswordConfig" />
        </div>

        <div class="form-group">
          <app-password [config]="confirmPasswordConfig" />
        </div>

        <div class="password-hint">
          <span class="material-icons">info</span>
          Password must be 8–15 characters and include a letter, number, and special character.
        </div>

        <div class="forgot-password-container">
          <button type="button" class="forgot-pwd-link" (click)="navigateToForgotPassword()">
            Forgot Password?
          </button>
        </div>

        <div class="form-actions-row">
          <button type="button" class="btn-secondary" (click)="goBack()">Cancel</button>
          <button type="submit" class="btn-primary" [disabled]="isSaving">
            <span class="material-icons">{{ isSaving ? 'hourglass_empty' : 'lock_reset' }}</span>
            {{ isSaving ? 'Updating...' : 'Update Password' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
