@if (visible) {
  <div class="pm-overlay" (click)="onCancel()">
    <div class="pm-modal" (click)="$event.stopPropagation()">
      <div class="pm-card">
  
        <div class="pm-header">
          <h4 class="pm-title">My Profile</h4>
          <button type="button" class="pm-close" (click)="onCancel()" aria-label="Close">✕</button>
        </div>
  
        <div *ngIf="isLoading" class="loading-wrapper">
          <div class="spinner"></div>
          <p>Loading profile...</p>
        </div>
  
        <ng-container *ngIf="!isLoading">
          <div class="avatar-header-section">
            <div class="avatar-circle">{{ initials }}</div>
            <h2 class="profile-name">{{ profile?.name }}</h2>
          </div>
  
          <form [formGroup]="profileForm" (ngSubmit)="onSubmit()" novalidate>
            <div class="pm-field">
              <app-name-field [config]="nameConfig" />
            </div>
            <div class="pm-field">
              <app-email [config]="emailConfig" />
            </div>
            <div class="pm-field">
              <app-mobile [config]="mobileConfig" />
            </div>
  
            <div class="pm-field">
              <div class="input-wrapper">
                <span class="material-icons input-icon">shield</span>
                <input class="form-input" type="text" [value]="roleName" readonly />
                <span class="lock-icon material-icons">lock</span>
              </div>
            </div>
  
            <button type="button" class="change-password-link-btn" (click)="openChangePassword()">
              <span class="material-icons">lock</span> Change Password
            </button>
  
            <div class="pm-footer">
              <app-button [config]="cancelBtnConfig"></app-button>
              <app-button [config]="submitBtnConfig"></app-button>
            </div>
          </form>
        </ng-container>
  
      </div>
    </div>
  </div>
  }
  
  <!-- Change Password Modal -->
  <app-change-password
    [visible]="isChangePasswordOpen"
    (closed)="isChangePasswordOpen = false"
  ></app-change-password>
