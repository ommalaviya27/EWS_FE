@if (visible) {
<div class="pm-overlay">
  <div class="pm-modal">
    <div class="pm-card">
      <div class="pm-header">
        <h4 class="pm-title">{{ isEditMode ? 'Edit Employee' : 'Add New Employee' }}</h4>
        <button type="button" class="pm-close" (click)="onCancel()">✕</button>
      </div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
        <div class="pm-two-col">
          <div class="pm-field">
            <label class="pm-label">Full Name <span class="pm-required">*</span></label>
            <app-name-field [config]="nameConfig"></app-name-field>
          </div>
          <div class="pm-field">
            <label class="pm-label">Mobile Number</label>
            <app-mobile [config]="mobileConfig"></app-mobile>
          </div>
        </div>

        <div class="pm-field">
          <label class="pm-label">Email <span class="pm-required">*</span></label>
          <app-email [config]="emailConfig"></app-email>
        </div>

        @if (!isEditMode) {
        <div class="pm-field">
          <label class="pm-label">Password</label>
          <app-password [config]="passwordConfig"></app-password>
        </div>
        }

        <div class="pm-field">
          <label class="pm-label">Role <span class="pm-required">*</span></label>
          <select
            class="form-select pm-input"
            formControlName="roleId"
            [class.is-invalid]="isInvalid('roleId')"
            (change)="onRoleChange()"
          >
            <option [ngValue]="null" disabled>Select role</option>
            @for (r of roleList; track r.value) {
            <option [value]="r.value">{{ r.label }}</option>
            }
          </select>
          @if (isInvalid('roleId')) {
          <div class="pm-error">Role is required.</div>
          }
        </div>

        <div class="pm-field" [class.pm-field-disabled]="!showTeamLeadField">
          <label class="pm-label">
            Assign to Team Lead @if (showTeamLeadField) {
            <span class="pm-optional">(Optional)</span>
            }
          </label>
          <select
            class="form-select pm-input"
            formControlName="teamLeadId"
            [disabled]="!showTeamLeadField"
          >
            <option [ngValue]="null">Not assigned</option>
            @for (tl of teamLeads; track tl.userId) {
            <option [value]="tl.userId">{{ tl.name }}</option>
            }
          </select>
          @if (showTeamLeadField && teamLeads.length === 0) {
          <div class="pm-hint">No active team leads available.</div>
          } @if (!showTeamLeadField) {
          <div class="pm-hint pm-hint-muted">Only available when role is Employee.</div>
          }
        </div>

        <div class="pm-field pm-checkbox-row">
          <input type="checkbox" id="statusCheck" formControlName="status" class="pm-checkbox" />
          <label for="statusCheck" class="pm-checkbox-label">Set as active user</label>
        </div>

        <div class="pm-footer">
          <button type="button" class="pm-btn pm-btn-cancel" (click)="onCancel()">Cancel</button>
          <button type="submit" class="pm-btn pm-btn-primary" [disabled]="isLoading">
            @if (isLoading) {
            <span class="spinner-border spinner-border-sm me-2"></span> Processing... } @else {
            {{ isEditMode ? 'Update Employee' : 'Add Employee' }} }
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
}
