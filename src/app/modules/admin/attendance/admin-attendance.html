<div class="adm-wrapper">
  @if (teamLeadsLoading) {
  <div class="adm-loading"><div class="spinner-border text-primary"></div></div>
  } @else if (teamLeads.length === 0) {
  <div class="adm-empty">No team leads found in the organization.</div>
  } @else {
  <app-team-attendance-grid
    [teamMembers]="teamLeadsAsMembers"
  ></app-team-attendance-grid>
  }
</div>
