@if (visible) {
<div class="pm-overlay" (click)="onCancel()">
  <div class="pm-modal" (click)="$event.stopPropagation()">
    <div class="pm-card">
      <div class="pm-header">
        <h4 class="pm-title">
          {{ isEditMode ? 'Edit Project' : 'Create New Project' }}
        </h4>
        <button type="button" class="pm-close" (click)="onCancel()">✕</button>
      </div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>

        <div class="pm-field">
          <app-name-field [config]="nameConfig"></app-name-field>
        </div>

        <div class="pm-field">
          <app-description-field [config]="descriptionConfig"></app-description-field>
        </div>

        <div class="pm-field">
          <div class="pm-fieldset"
            [class.is-invalid-wrap]="isInvalid('userId')"
            [class.has-value]="form.get('userId')?.value">
            <span class="pm-legend">Assign Team Lead</span>
            <select class="pm-select-input" formControlName="userId">
              <option [value]="null" disabled>Select team lead</option>
              @for (tl of teamLeaders; track tl.userId) {
                <option [value]="tl.userId">{{ tl.name }}</option>
              }
            </select>
          </div>
          @if (isInvalid('userId')) {
            <div class="pm-error">Team lead is required.</div>
          }
        </div>

        <div class="pm-date-row">
          <div class="pm-field">
            <div class="pm-fieldset"
              [class.is-invalid-wrap]="isInvalid('startDate')"
              [class.has-value]="form.get('startDate')?.value">
              <span class="pm-legend">Start Date</span>
              <input type="date" class="pm-date-input" id="startDate" formControlName="startDate" [min]="today"/>
            </div>
            @if (isInvalid('startDate')) {
              <div class="pm-error">Start date is required.</div>
            }
          </div>

          <div class="pm-field">
            <div class="pm-fieldset"
              [class.is-invalid-wrap]="isInvalid('endDate')"
              [class.has-value]="form.get('endDate')?.value">
              <span class="pm-legend">End Date</span>
              <input type="date" class="pm-date-input" id="endDate" formControlName="endDate" [min]="minEndDate"/>
            </div>
            @if (isInvalid('endDate')) {
              <div class="pm-error">End date is required.</div>
            }
          </div>
        </div>

        <div class="pm-field">
          <div class="pm-fieldset has-value">
            <span class="pm-legend">Status</span>
            <select class="pm-select-input" formControlName="projectStatus">
              @for (s of statusList; track s.value) {
                <option [value]="s.value">{{ s.label }}</option>
              }
            </select>
          </div>
        </div>

        <div class="pm-footer">
          <app-button [config]="cancelBtnConfig"></app-button>
          <app-button [config]="submitBtnConfig"></app-button>
        </div>

      </form>
    </div>
  </div>
</div>
}
