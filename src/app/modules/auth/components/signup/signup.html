<div class="auth-page">
  <!-- Left Panel -->
  <div class="auth-left">
    <div class="auth-card">

      <!-- Brand -->
      <div class="brand">
        <div class="brand-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
            <polyline points="10 9 9 9 8 9"/>
          </svg>
        </div>
        <h1 class="brand-title">Create Account</h1>
        <p class="brand-subtitle">Join the Employee Task Management System</p>
      </div>

      <!-- Form -->
      <form [formGroup]="signupForm" (ngSubmit)="onSubmit()" novalidate class="auth-form">

        <!-- Row: Name + Mobile -->
        <div class="form-row">
          <div class="form-group">
            <app-name-field [config]="nameConfig"></app-name-field>
          </div>
          <div class="form-group">
            <app-mobile [config]="mobileConfig"></app-mobile>
          </div>
        </div>

        <!-- Email -->
        <div class="form-group">
          <app-email [config]="emailConfig"></app-email>
        </div>

        <!-- Row: Password + Confirm -->
        <div class="form-row">
          <div class="form-group">
            <app-password [config]="passwordConfig"></app-password>
          </div>
          <div class="form-group">
            <app-password [config]="confirmPasswordConfig"></app-password>
          </div>
        </div>

        @if (signupForm.errors?.['passwordMismatch'] && signupForm.get('confirmPassword')?.touched) {
          <div class="mismatch-error">Passwords do not match.</div>
        }

        <button type="submit" class="btn-primary" [disabled]="isLoading">
          @if (isLoading) {
            <span class="spinner"></span>
          }
          Create Account
        </button>

        <div class="login-row">
          <span class="login-text">Already have an account?</span>
          <span class="login-link" (click)="goToLogin()">Sign In</span>
        </div>

      </form>
    </div>
  </div>
</div>
