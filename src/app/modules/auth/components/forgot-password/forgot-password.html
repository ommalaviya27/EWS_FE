<div class="auth-page">
  <div class="auth-left">
    <div class="auth-card">

      <div class="brand">
        <div class="brand-icon">
          <img src="assets/images/project-logo.png" alt="Logo" />
        </div>
        <h1 class="brand-title">Forgot Password?</h1>
        <p class="brand-subtitle">Enter your email to receive a reset link</p>
      </div>

      @if (!emailSent) {
        <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" novalidate class="auth-form">
          <div class="form-group">
            <app-email [config]="emailConfig"></app-email>
          </div>

          <app-button [config]="submitBtnConfig"></app-button>

          <div class="back-row">
            <span class="back-link" (click)="goToLogin()">
              <span class="material-icons">chevron_left</span>
              <span class="back-text">Back to Sign In</span>
            </span>
          </div>
        </form>
      } @else {
        <div class="success-state">
          <div class="success-icon">
            <span class="material-icons">mail</span>
          </div>
          <h3 class="success-title">Check your email</h3>
          <p class="success-desc">
            We've sent a password reset link to your email address. It may take a minute to arrive.
          </p>
          <app-button [config]="resendBtnConfig"></app-button>
        </div>
      }
    </div>
  </div>
</div>
