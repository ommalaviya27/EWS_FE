<div class="auth-page">
  <div class="auth-left">
    <div class="auth-card">

      <div class="brand">
        <div class="brand-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
          </svg>
        </div>
        <h1 class="brand-title">Forgot Password?</h1>
        <p class="brand-subtitle">Enter your email to receive a reset link</p>
      </div>

      @if (!emailSent) {
        <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" novalidate class="auth-form">
          <div class="form-group">
            <app-email [config]="emailConfig"></app-email>
          </div>

          <button type="submit" class="btn-primary" [disabled]="isLoading">
            @if (isLoading) {
              <span class="spinner"></span>
            }
            Send Reset Link
          </button>

          <div class="back-row">
            <span class="back-link" (click)="goToLogin()">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <polyline points="15 18 9 12 15 6"/>
              </svg>
              Back to Sign In
            </span>
          </div>
        </form>
      } @else {
        <div class="success-state">
          <div class="success-icon">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#4f46e5" stroke-width="2">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.61 3.4 2 2 0 0 1 3.6 1.22h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L7.91 8.9a16 16 0 0 0 6.19 6.19l.95-.95a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
            </svg>
          </div>
          <h3 class="success-title">Check your email</h3>
          <p class="success-desc">
            We've sent a password reset link to your email address. It may take a minute to arrive.
          </p>
          <button type="button" class="btn-primary" (click)="goToLogin()">
            Back to Sign In
          </button>
        </div>
      }

    </div>
  </div>
</div>
