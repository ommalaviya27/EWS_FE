<div class="auth-page">
  <div class="auth-left">
    <div class="auth-card">

      <div class="brand">
        <div class="brand-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </div>
        <h1 class="brand-title">Reset Password</h1>
        <p class="brand-subtitle">Create a new secure password for your account</p>
      </div>

      <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" novalidate class="auth-form">

        <div class="form-group">
          <app-password [config]="newPasswordConfig"></app-password>
        </div>

        <div class="form-group">
          <app-password [config]="confirmPasswordConfig"></app-password>
        </div>

        @if (resetForm.errors?.['passwordMismatch'] && resetForm.get('confirmPassword')?.touched) {
          <div class="error-text">Passwords do not match.</div>
        }

        <app-button [config]="submitButtonConfig"></app-button>

        <div class="back-row">
          <span class="back-link" (click)="goToLogin()">
            <span class="material-icons" style="font-size: 16px">arrow_back</span>
            <span class="back-text">Back to Sign In</span>
          </span>
        </div>
      </form>

    </div>
  </div>
</div>
