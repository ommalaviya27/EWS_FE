<div class="auth-page">
  <div class="auth-card">
    <div class="brand">
      <div class="logo-box">
        <img src="assets/images/project-logo.png" alt="Logo" />
      </div>
      <h1 class="brand-title">Task Manager</h1>
      <p class="brand-subtitle">Employee Task &amp; Work Management System</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate class="auth-form">
      <div class="form-field">
        <app-email [config]="emailConfig"></app-email>
        <app-password [config]="passwordConfig"></app-password>
      </div>

      <div class="forgot-row">
        <span class="forgot-link" (click)="goToForgotPassword()">Forgot Password?</span>
      </div>
      
      <app-button [config]="submitBtnConfig"></app-button>

      <div class="divider">
        <span>or</span>
      </div>

      <div class="signup-row">
        <span class="signup-text">New user?</span>
        <span class="signup-link" (click)="goToSignup()">Create an account</span>
      </div>
    </form>
  </div>
</div>
