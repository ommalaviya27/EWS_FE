<div class="auth-page">
  <!-- Left Panel -->
  <div class="auth-card">
    <!-- Logo -->
    <div class="brand">
      <div class="brand-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
          <polyline points="14 2 14 8 20 8" />
          <line x1="16" y1="13" x2="8" y2="13" />
          <line x1="16" y1="17" x2="8" y2="17" />
          <polyline points="10 9 9 9 8 9" />
        </svg>
      </div>
      <h1 class="brand-title">Task Manager</h1>
      <p class="brand-subtitle">Employee Task &amp; Work Management System</p>
    </div>

    <!-- Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate class="auth-form">
      <div class="form-group">
        <app-email [config]="emailConfig"></app-email>
      </div>

      <div class="form-group">
        <app-password [config]="passwordConfig"></app-password>
      </div>

      <div class="forgot-row">
        <span class="forgot-link" (click)="goToForgotPassword()">Forgot Password?</span>
      </div>

      <button type="submit" class="btn-primary" [disabled]="isLoading">
        @if (isLoading) {
        <span class="spinner"></span>
        } Sign In
      </button>

      <div class="divider">
        <span>or</span>
      </div>

      <div class="signup-row">
        <span class="signup-text">New user?</span>
        <span class="signup-link" (click)="goToSignup()">Create an account</span>
      </div>
    </form>
  </div>
</div>
