<div class="tla-wrapper">
  <div class="tla-page-header">
    <div>
      <h2 class="tla-title">Self Attendance</h2>
    </div>
  </div>

  <app-attendance-calendar></app-attendance-calendar>

  @if (teamMembersLoading) {
    <div class="tla-loading">
      <div class="spinner-border text-primary"></div>
    </div>
  } @else if (teamMembers.length === 0) {
    <div class="tla-empty">No team members assigned under you yet.</div>
  } @else {
    <app-team-attendance-grid
      [teamMembers]="teamMembers"
      [groupLabel]="currentUserName"
    ></app-team-attendance-grid>
  }
</div>
