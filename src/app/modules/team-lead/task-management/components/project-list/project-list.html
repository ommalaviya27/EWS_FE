<div class="pl-wrapper">
  <div class="pl-cards-grid">
    @for (project of projects; track project.id) {
    <div class="pl-card" (click)="onProjectClick(project)">
      <div class="pl-card-body">
        <div class="pl-card-header">
          <h4 class="pl-card-title">{{ project.name }}</h4>
          <div class="pl-card-badges">
            <span class="project-status-badge" [attr.data-status]="project.projectStatus">
              {{ getStatusLabel(project.projectStatus) }}
            </span>
          </div>
        </div>

        <p
          class="pl-card-desc"
          (mouseenter)="showTooltip($event, project.description)"
          (mousemove)="moveTooltip($event)"
          (mouseleave)="hideTooltip()"
        >
          {{ project.description }}
        </p>

        <div class="pl-card-footer">
          <div class="pl-card-meta">
            <span class="pl-card-date">
              {{ formatDate(project.startDate) }} - {{ formatDate(project.endDate) }}
            </span>
            <button class="pl-view-btn" (click)="onProjectClick(project); $event.stopPropagation()">
              Create Tasks
            </button>
          </div>
        </div>
      </div>
    </div>
    }
  </div>
</div>

@if (tooltip.visible) {
<div class="desc-tooltip" [style.top.px]="tooltip.y" [style.left.px]="tooltip.x">
  {{ tooltip.text }}
</div>
}
